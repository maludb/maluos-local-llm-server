[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maluos-local-llm-server"
description = "The queue in front of a machine that runs models: an inference node for a MaluOS estate on any host with Ollama"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
sllm = "server.cli:main"

[tool.setuptools]
packages = ["server", "server.backends"]

[tool.setuptools.dynamic]
version = { attr = "server.__version__" }
